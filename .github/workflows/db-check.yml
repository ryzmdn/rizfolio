name: Database Schema Check

on:
  push:
    paths:
      - "packages/db/**"
      - ".github/workflows/db-check.yml"
  pull_request:
    paths:
      - "packages/db/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-schema-check:
    name: Drizzle Schema & Type Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Package Typecheck
        run: pnpm --filter @workspace/db typecheck

      - name: Run Database Package Lint
        run: pnpm --filter @workspace/db lint
