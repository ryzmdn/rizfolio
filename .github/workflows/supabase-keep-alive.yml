name: Supabase Keep-Alive Cron

on:
  schedule:
    # Runs at 04:00 UTC every 2 days (Supabase free tier pauses after 7 days of inactivity)
    - cron: "0 4 */2 * *"
  workflow_dispatch:

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: true

jobs:
  keep-alive:
    name: Supabase Inactivity Prevention Ping
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Supabase Keep-Alive Health Check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm db:keep-alive
